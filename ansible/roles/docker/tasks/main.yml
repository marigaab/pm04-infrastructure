---
- name: Instalar dependências para repositório Docker
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-pip
      - python3-docker
    state: present

- name: Instalar Docker via script oficial (se ainda não estiver instalado)
  shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker

- name: Garantir que o serviço Docker esteja ativo e habilitado no boot
  service:
    name: docker
    state: started
    enabled: yes

- name: Adicionar usuário ubuntu ao grupo docker
  user:
    name: ubuntu
    groups: docker
    append: yes